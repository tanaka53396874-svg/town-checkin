<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>町丁目制覇</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/@tomickigrzegorz/leaflet-rotate@0.2.4/dist/leaflet-rotate.css"/>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* 上部の白背景は最小限。通常時は約44pxだけ使用 */
        #topBar {
            position: relative;
            z-index: 1200;
            flex: 0 0 auto;
            min-height: 44px;
            padding: 4px 8px;
            box-sizing: border-box;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }

        #mapWrap {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
        }

        #map {
            position: absolute;
            inset: 0;
            height: 100%;
            width: 100%;
        }

        /* 地図上に重ねる主要操作 */
        #mapMainControls {
            position: absolute;
            z-index: 1000;
            left: 70px;
            top: 10px;
            display: flex;
            gap: 7px;
            align-items: center;
            pointer-events: auto;
        }

        #mapMainControls button {
            margin: 0;
            min-height: 44px;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.94);
            box-shadow: 0 1px 5px rgba(0,0,0,0.30);
            font-weight: bold;
            touch-action: manipulation;
        }

        #checkInButton:not(:disabled) {
            background: rgba(255,255,255,0.97);
        }

        #mapInfoPanel {
            position: absolute;
            z-index: 999;
            left: 10px;
            top: 62px;
            max-width: calc(100% - 80px);
            padding: 5px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.86);
            box-shadow: 0 1px 4px rgba(0,0,0,0.18);
            pointer-events: none;
        }

        #mapInfoPanel #locationInfo,
        #mapInfoPanel #checkInStatus {
            margin: 0;
            font-size: 13px;
            line-height: 1.35;
        }

        #mapInfoPanel #locationInfo {
            font-weight: bold;
        }

        button, input {
            font-size: 16px;
            padding: 9px 12px;
            margin: 3px 2px 7px 0;
        }

        #titleRow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 36px;
        }

        #titleRow h2 {
            margin: 0;
            font-size: 18px;
            white-space: nowrap;
        }

        #headerRight {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        #settingsButton {
            width: 36px;
            height: 36px;
            margin: 0;
            padding: 0;
            border: 1px solid #bbb;
            border-radius: 8px;
            background: #fff;
            font-size: 23px;
            line-height: 34px;
            cursor: pointer;
            touch-action: manipulation;
        }

        #authBox {
            margin: 0;
        }

        #authStatus {
            margin: 0;
            font-size: 13px;
            white-space: nowrap;
        }

        #loginForm {
            padding-top: 6px;
        }

        #settingsPanel {
            display: none;
            position: absolute;
            right: 8px;
            top: 44px;
            width: min(310px, calc(100vw - 16px));
            margin: 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f7f7f7;
        }

        #settingsPanel.open {
            display: block;
        }

        #migrationArea {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
        }

        #locationInfo, #checkInStatus {
            margin: 0;
        }

        /* 地図内に常時表示する「現在地に戻る」ボタン */
        .leaflet-control-current-location {
            background: #fff;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.35);

            /* iPhone Safariの下部メニューと重ならないよう上へ移動 */
            margin-bottom: calc(90px + env(safe-area-inset-bottom)) !important;
        }

        .leaflet-control-current-location button {
            display: block;
            width: 44px;
            height: 44px;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 3px;
            background: #fff;
            font-size: 25px;
            line-height: 44px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .leaflet-control-current-location button:active {
            background: #eee;
        }

        /* 町丁目の訪問色レイヤー ON/OFF ボタン */
        .leaflet-control-visit-layer {
            background: #fff;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.35);
        }

        .leaflet-control-visit-layer button {
            display: block;
            min-width: 52px;
            height: 44px;
            margin: 0;
            padding: 0 7px;
            border: 0;
            border-radius: 3px;
            background: #fff;
            font-size: 13px;
            font-weight: bold;
            line-height: 44px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .leaflet-control-visit-layer button:active {
            background: #eee;
        }

        /* 進行方向を上にするモード */
        .leaflet-control-heading-up {
            background: #fff;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.35);
        }

        .leaflet-control-heading-up button {
            display: block;
            min-width: 58px;
            height: 44px;
            margin: 0;
            padding: 0 6px;
            border: 0;
            border-radius: 3px;
            background: #fff;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .leaflet-control-heading-up button.active {
            background: #dff1ff;
        }

        /* 歩数管理 */
        #tabBar{display:flex;gap:6px;margin-top:5px}
        #tabBar button{flex:1;margin:0;padding:7px;border:1px solid #ccd3da;border-radius:7px;background:#f3f6f9;font-weight:bold}
        #tabBar button.active{background:#dcecfb;border-color:#5798cc}
        #healthWrap{display:none;flex:1;min-height:0;overflow-y:auto;background:#f5f7fa;padding:12px;box-sizing:border-box}
        #healthWrap.active{display:block} #mapWrap.hidden{display:none}
        .health-container{max-width:780px;margin:0 auto;padding-bottom:30px}
        .health-card{background:white;border:1px solid #e1e5ea;border-radius:12px;padding:13px;margin-bottom:12px;box-shadow:0 1px 4px #00000009}
        .health-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
        .health-row button{margin:0;padding:7px 11px;border-radius:7px;border:1px solid #ccd3da;background:white}
        .health-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
        .health-stat{background:#f5f8fc;border-radius:8px;padding:10px}
        .health-stat strong{display:block;font-size:21px;margin-top:4px}
        .health-stat small{color:#667085}
        #healthCalendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
        .health-day{min-height:65px;padding:5px 2px;border:1px solid #e3e8ed;border-radius:6px;background:white;text-align:center;font-size:12px;min-width:0;overflow:hidden}
        .health-day:disabled{color:#b3b9c1;background:#fafafa}
        .health-day .step{font-size:12px;font-weight:bold;display:block;margin-top:4px}
        .health-day.achieved{background:#e7f6e9;border-color:#a6d7ad}
        .health-day.selected{outline:2px solid #448bcb}
        .health-week{text-align:center;font-size:12px;font-weight:bold;color:#667085}
        .health-sub{font-size:11px;color:#657181;display:block}
        .health-card h3{margin:0 0 10px;font-size:16px}
        .health-chart{height:220px;position:relative}
        .health-chart canvas{width:100%!important;height:100%!important}
        .health-fields label{display:block;font-weight:bold;font-size:13px;margin-top:10px}
        .health-fields input,.health-fields textarea{width:100%;box-sizing:border-box;margin:5px 0;padding:9px;border:1px solid #cbd5df;border-radius:7px;font:inherit}
        .health-fields textarea{min-height:75px}
        #healthDetail{display:none}
        .health-msg{font-size:13px;color:#556274;margin:8px 0}
        #healthSettings{display:none;margin-top:10px}
        @media(max-width:400px){.health-day{min-height:61px;font-size:11px}.health-day .step{font-size:11px}#healthWrap{padding:7px}}
    </style>
</head>

<body>

<div id="topBar">
    <div id="titleRow">
        <h2>町丁目制覇</h2>

        <div id="headerRight">
            <div id="authStatus">Supabaseに接続中...</div>
            <button id="settingsButton" type="button" onclick="toggleSettings()"
                    aria-label="設定" title="設定">⚙</button>
        </div>
    </div>
    <div id="tabBar"><button id="mapTab" class="active" onclick="switchTab('map')">🗺 地図</button><button id="healthTab" onclick="switchTab('health')">👟 歩数管理</button></div>

    <div id="authBox">
        <div id="loginForm">
            <input id="email" type="email" autocomplete="username" placeholder="メールアドレス">
            <input id="password" type="password" autocomplete="current-password" placeholder="パスワード">
            <button onclick="login()">ログイン</button>
        </div>

        <div id="settingsPanel">
            <div id="loggedInControls" style="display:none;">
                <button onclick="logout()">ログアウト</button>

                <div id="migrationArea">
                    <button id="migrationButton" onclick="migrateLocalVisits()" style="display:none;">
                        この端末の旧Visit記録を移行
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="mapWrap">
    <div id="map"></div>

    <div id="mapMainControls">
        <button id="checkInButton" onclick="checkIn()" disabled>CHECK IN</button>
    </div>

    <div id="mapInfoPanel">
        <div id="locationInfo">現在地：まだ取得していません</div>
        <div id="checkInStatus">ログインするとチェックインできます</div>
    </div>
</div>


<div id="healthWrap"><div class="health-container">
  <div class="health-card"><div class="health-row"><h3 style="margin:0">歩数・健康管理</h3><button onclick="loadHealthData()">↻ 更新</button></div>
    <div id="healthMessage" class="health-msg">ログインするとデータを表示します。</div>
    <div class="health-row"><span id="healthGoalText">目標 5,000歩/日</span><button onclick="toggleHealthSettings()" title="歩数目標を変更">⚙ 目標設定</button></div>
    <div id="healthSettings" class="health-fields"><label for="healthGoalInput">今日からの歩数目標</label><input id="healthGoalInput" type="number" min="1" max="100000" step="1" value="5000"><button onclick="saveHealthGoal()">目標を保存</button><div class="health-msg">変更した日から適用され、過去の達成判定は変わりません。</div></div>
  </div>
  <div class="health-card"><div class="health-row"><button onclick="moveHealthMonth(-1)">◀ 前月</button><strong id="healthMonthLabel"></strong><button onclick="moveHealthMonth(1)">翌月 ▶</button></div><div id="healthCalendar"></div><div class="health-msg">緑：目標達成 ／ ―：歩数記録なし ／ 📝：メモあり。今日の歩数は表示しません。</div></div>
  <div class="health-card" id="healthDetail"><h3 id="healthDetailTitle"></h3><div id="healthDetailSteps" class="health-msg"></div><div class="health-fields"><label for="healthWeight">体重（kg、小数1桁）</label><input id="healthWeight" type="number" min="1" max="999.9" step="0.1" placeholder="未記録"><label for="healthMemo">メモ</label><textarea id="healthMemo" maxlength="3000" placeholder="自由に記録"></textarea></div><div class="health-row"><button onclick="saveHealthNote()">保存</button><button onclick="deleteHealthNote()">体重・メモを削除</button><button onclick="document.getElementById('healthDetail').style.display='none'">閉じる</button></div></div>
  <div class="health-card"><h3>歩数の統計</h3><div id="healthStats" class="health-grid"></div></div>
  <div class="health-card"><div class="health-row"><h3>歩数グラフ</h3><select id="stepChartPeriod" onchange="renderHealthCharts()"><option value="month">今月</option><option value="30">直近30日</option></select><select id="stepChartType" onchange="renderHealthCharts()"><option value="bar">棒グラフ</option><option value="line">折れ線</option></select></div><div class="health-chart"><canvas id="stepsChart"></canvas></div></div>
  <div class="health-card"><div class="health-row"><h3>体重グラフ・統計</h3><select id="weightChartPeriod" onchange="renderHealthCharts()"><option value="30">直近30日</option><option value="month">今月</option><option value="year">今年</option></select></div><div id="weightStats" class="health-msg"></div><div class="health-chart"><canvas id="weightChart"></canvas></div></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@tomickigrzegorz/leaflet-rotate@0.2.4/dist/leaflet-rotate.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ============================================================
    // Supabase設定
    // この2か所だけ、自分のSupabaseの値に置き換えてください。
    // Secret key / service_role key は絶対に入れないでください。
    // ============================================================
    const SUPABASE_URL = 'https://zinykdjisortaxuixnbi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2yG5Wf27ihXU1QDqCr3c-w_N8M-ZNp3';

    // 町丁目制覇側でデプロイした読み取り専用Edge FunctionのURLを設定します。
    const STEP_READ_FUNCTION_URL = 'https://zinykdjisortaxuixnbi.supabase.co/functions/v1/read-step-higher';
    const AREA_ID = 'tama';
    const OLD_STORAGE_KEY = 'townCheckinVisitsV1';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let visits = {};
    let townLayer = null;
    let currentTownForCheckIn = null;
    let currentTownLayer = null;

    let locationMarker = null;
    let watchId = null;
    let firstLocationUpdate = true;
    let lastLatitude = null;
    let lastLongitude = null;
    let headingUpEnabled = false;
    let lastHeading = null;
    let headingUpButton = null;

    // 訪問色付き町丁目レイヤーの表示状態
    let visitLayerVisible = true;
    let visitLayerToggleButton = null;

    const colors = [
        '#ffffff',
        '#90ee90',
        '#87ceeb',
        '#ffff66',
        '#ffb347',
        '#ff6666'
    ];

    // ============================================================
    // 地図
    // ============================================================
    const map = L.map('map', {
        center: [35.63, 139.43],
        zoom: 13,
        rotate: true,
        touchRotate: true,
        dragRotate: true,
        rotateClockwise: true,
        preventPageGestures: true,
        rotateControl: {
            position: 'topright',
            behavior: 'reset',
            closeOnZeroBearing: false
        }
    });

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    // ============================================================
    // 「進行方向を上」モード
    // GPSが返す heading（移動方向）を使って地図を自動回転します。
    // 停止中などheadingが得られない間は、最後に得た向きを維持します。
    // ============================================================
    const HeadingUpControl = L.Control.extend({
        options: { position: 'topright' },

        onAdd: function() {
            const container = L.DomUtil.create(
                'div', 'leaflet-control-heading-up'
            );
            const button = L.DomUtil.create('button', '', container);
            button.type = 'button';
            button.textContent = '進行↑';
            button.title = '進行方向を画面上にする';
            button.setAttribute('aria-label', '進行方向を画面上にする');

            headingUpButton = button;

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);
            L.DomEvent.on(button, 'click', function(e) {
                L.DomEvent.stop(e);
                toggleHeadingUp();
            });

            return container;
        }
    });

    map.addControl(new HeadingUpControl());

    function toggleHeadingUp() {
        headingUpEnabled = !headingUpEnabled;

        if (headingUpButton) {
            headingUpButton.classList.toggle('active', headingUpEnabled);
            headingUpButton.textContent =
                headingUpEnabled ? '進行↑ ON' : '進行↑';
        }

        if (headingUpEnabled) {
            // 追跡していなければGPS追跡も開始。
            if (watchId === null) getLocation();

            if (lastHeading !== null && typeof map.setHeading === 'function') {
                map.setHeading(lastHeading);
            }
        } else {
            if (typeof map.setHeading === 'function') {
                map.setHeading(null);
            }
        }
    }

    // ============================================================
    // 地図内の「現在地に戻る」ボタン
    // 地図を画面いっぱいに表示しても常に右下に残ります。
    // ============================================================
    const CurrentLocationControl = L.Control.extend({
        options: {
            position: 'bottomright'
        },

        onAdd: function() {
            const container = L.DomUtil.create(
                'div',
                'leaflet-control-current-location'
            );

            const button = L.DomUtil.create('button', '', container);
            button.type = 'button';
            button.innerHTML = '◎';
            button.title = '現在地に戻る';
            button.setAttribute('aria-label', '現在地に戻る');

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);

            L.DomEvent.on(button, 'click', function(e) {
                L.DomEvent.stop(e);
                returnToCurrentLocation();
            });

            return container;
        }
    });

    map.addControl(new CurrentLocationControl());

    // ============================================================
    // 地図内の「訪問色レイヤー ON/OFF」ボタン
    // 道路・店名などを見やすくしたいときに町丁目レイヤーを隠せます。
    // 再度ONにすると、訪問回数の色・現在地の強調もそのまま復元します。
    // ============================================================
    const VisitLayerControl = L.Control.extend({
        options: {
            position: 'bottomright'
        },

        onAdd: function() {
            const container = L.DomUtil.create(
                'div',
                'leaflet-control-visit-layer'
            );

            const button = L.DomUtil.create('button', '', container);
            button.type = 'button';
            button.title = '訪問色レイヤーを表示・非表示';
            button.setAttribute(
                'aria-label',
                '訪問色レイヤーを表示・非表示'
            );

            visitLayerToggleButton = button;
            updateVisitLayerButton();

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);

            L.DomEvent.on(button, 'click', function(e) {
                L.DomEvent.stop(e);
                toggleVisitLayer();
            });

            return container;
        }
    });

    map.addControl(new VisitLayerControl());

    function updateVisitLayerButton() {
        if (!visitLayerToggleButton) return;

        visitLayerToggleButton.textContent =
            visitLayerVisible ? '色 OFF' : '色 ON';

        visitLayerToggleButton.title =
            visitLayerVisible
                ? '訪問色レイヤーを隠す'
                : '訪問色レイヤーを表示する';
    }

    function toggleVisitLayer() {
        if (!townLayer) return;

        if (visitLayerVisible) {
            map.removeLayer(townLayer);
            visitLayerVisible = false;
        } else {
            townLayer.addTo(map);
            visitLayerVisible = true;

            // 表示を戻したとき、Visit色と現在地の強調を最新状態にする。
            refreshAllTownStyles();
        }

        updateVisitLayerButton();
    }

    // ============================================================
    // Visitデータ
    // ============================================================
    function getVisitRecord(townName) {
        const r = visits[townName] || {};
        return {
            count: Math.min(Number(r.count) || 0, 5),
            lastCheckInDate: r.lastCheckInDate || null
        };
    }

    function getTodayString() {
        const d = new Date();
        return d.getFullYear() + '-' +
            String(d.getMonth() + 1).padStart(2, '0') + '-' +
            String(d.getDate()).padStart(2, '0');
    }

    function normalStyle(feature) {
        const record = getVisitRecord(feature.properties.S_NAME);
        feature.visitCount = record.count;

        return {
            color: '#555',
            weight: 1,
            fillColor: colors[record.count],
            fillOpacity: record.count === 0 ? 0.5 : 0.7
        };
    }

    function onEachFeature(feature, layer) {
        const townName = feature.properties.S_NAME;
        feature.visitCount = getVisitRecord(townName).count;

        layer.on('click', function() {
            const record = getVisitRecord(townName);

            layer.bindPopup(
                '<b>' + townName + '</b><br>' +
                '訪問回数：' + record.count + '回'
            ).openPopup();
        });
    }

    function refreshAllTownStyles() {
        if (!townLayer) return;

        townLayer.eachLayer(function(layer) {
            const townName = layer.feature.properties.S_NAME;
            const count = getVisitRecord(townName).count;

            layer.feature.visitCount = count;

            layer.setStyle({
                color: layer === currentTownLayer ? '#0000ff' : '#555',
                weight: layer === currentTownLayer ? 4 : 1,
                fillColor: colors[count],
                fillOpacity: layer === currentTownLayer
                    ? 0.8
                    : (count === 0 ? 0.5 : 0.7)
            });
        });
    }

    // ============================================================
    // GeoJSON
    // ============================================================
    fetch('towns.geojson')
        .then(response => {
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return response.json();
        })
        .then(data => {
            townLayer = L.geoJSON(data, {
                style: normalStyle,
                onEachFeature: onEachFeature
            }).addTo(map);

            refreshAllTownStyles();
        })
        .catch(error => {
            console.error('GeoJSONの読み込みに失敗しました:', error);
            alert('towns.geojsonを読み込めませんでした');
        });

    // ============================================================
    // 設定パネル
    // ============================================================
    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');

        // 未ログイン時はログイン欄が通常表示されるため、
        // 設定パネルにはログイン後専用の操作だけを置きます。
        if (!currentUser) {
            alert('現在はログインしていません');
            return;
        }

        panel.classList.toggle('open');
    }

    function closeSettings() {
        document.getElementById('settingsPanel').classList.remove('open');
    }

    // ============================================================
    // Supabase認証
    // ============================================================
    async function initializeAuth() {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) {
            console.error(error);
            document.getElementById('authStatus').textContent =
                'ログイン状態を確認できませんでした';
            return;
        }

        await applySession(data.session);

        supabaseClient.auth.onAuthStateChange((event, session) => {
            setTimeout(function() {
                applySession(session);
            }, 0);
        });
    }

    async function applySession(session) {
        currentUser = session ? session.user : null;

        const loginForm = document.getElementById('loginForm');
        const loggedInControls =
            document.getElementById('loggedInControls');
        const authStatus = document.getElementById('authStatus');

        if (currentUser) {
            loginForm.style.display = 'none';
            loggedInControls.style.display = 'block';

            // メールアドレスは通常画面には表示しません。
            authStatus.textContent = '● ログイン済み';

            await loadVisitsFromSupabase();
            if (document.getElementById('healthWrap').classList.contains('active')) await loadHealthData();
            updateMigrationButton();
        } else {
            visits = {};
            healthSteps = {}; healthNotes = {}; healthGoals = [];
            document.getElementById('healthMessage').textContent = 'ログインするとデータを表示します。';
            renderHealth();
            loginForm.style.display = 'block';
            loggedInControls.style.display = 'none';
            authStatus.textContent = 'ログインしてください';
            closeSettings();

            refreshAllTownStyles();
            updateCheckInUI();
        }
    }

    async function login() {
        const email =
            document.getElementById('email').value.trim();
        const password =
            document.getElementById('password').value;

        if (!email || !password) {
            alert('メールアドレスとパスワードを入力してください');
            return;
        }

        document.getElementById('authStatus').textContent =
            'ログイン中...';

        const { error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            console.error(error);
            document.getElementById('authStatus').textContent =
                'ログインに失敗しました';

            alert(
                'ログインできませんでした。\n' +
                'メールアドレスとパスワードを確認してください。'
            );
        }
    }

    async function logout() {
        closeSettings();

        const { error } = await supabaseClient.auth.signOut();

        if (error) {
            console.error(error);
            alert('ログアウトに失敗しました');
        }
    }

    // ============================================================
    // SupabaseからVisit記録を読む
    // ============================================================
    async function loadVisitsFromSupabase() {
        if (!currentUser) return;

        document.getElementById('checkInStatus').textContent =
            'Visit記録を読み込み中...';

        const { data, error } = await supabaseClient
            .from('town_visits')
            .select(
                'town_key, town_name, visit_count, last_checkin_date'
            )
            .eq('area', AREA_ID);

        if (error) {
            console.error(error);

            alert(
                'Visit記録を読み込めませんでした。\n' +
                'Supabaseの設定を確認してください。'
            );

            updateCheckInUI();
            return;
        }

        visits = {};

        for (const row of data) {
            visits[row.town_key] = {
                count: Math.min(Number(row.visit_count) || 0, 5),
                lastCheckInDate: row.last_checkin_date || null
            };
        }

        refreshAllTownStyles();
        updateCheckInUI();
    }

    // ============================================================
    // CHECK IN
    // ============================================================
    function updateCheckInUI() {
        const button =
            document.getElementById('checkInButton');
        const status =
            document.getElementById('checkInStatus');

        if (!currentUser) {
            button.disabled = true;
            status.textContent =
                'ログインするとチェックインできます';
            return;
        }

        if (!currentTownForCheckIn) {
            button.disabled = true;
            status.textContent =
                '現在地を取得するとチェックインできます';
            return;
        }

        const townName =
            currentTownForCheckIn.feature.properties.S_NAME;
        const record = getVisitRecord(townName);
        const today = getTodayString();

        if (record.count >= 5) {
            button.disabled = true;
            status.textContent =
                townName + '：5回達成済みです';
        } else if (record.lastCheckInDate === today) {
            button.disabled = true;
            status.textContent =
                townName +
                '：今日はCHECK IN済みです（' +
                record.count + '/5回）';
        } else {
            button.disabled = false;
            status.textContent =
                townName +
                '：CHECK INできます（現在 ' +
                record.count + '/5回）';
        }
    }

    async function checkIn() {
        if (!currentUser || !currentTownForCheckIn) return;

        const button =
            document.getElementById('checkInButton');
        const townName =
            currentTownForCheckIn.feature.properties.S_NAME;
        const record = getVisitRecord(townName);
        const today = getTodayString();

        if (
            record.count >= 5 ||
            record.lastCheckInDate === today
        ) {
            updateCheckInUI();
            return;
        }

        button.disabled = true;

        document.getElementById('checkInStatus').textContent =
            townName + '：保存中...';

        const newCount = record.count + 1;

        const { error } = await supabaseClient
            .from('town_visits')
            .upsert(
                {
                    user_id: currentUser.id,
                    area: AREA_ID,
                    town_key: townName,
                    town_name: townName,
                    visit_count: newCount,
                    last_checkin_date: today,
                    updated_at: new Date().toISOString()
                },
                {
                    onConflict: 'user_id,area,town_key'
                }
            );

        if (error) {
            console.error(error);

            alert(
                'CHECK INを保存できませんでした。\n' +
                '通信状態を確認して、もう一度試してください。'
            );

            updateCheckInUI();
            return;
        }

        visits[townName] = {
            count: newCount,
            lastCheckInDate: today
        };

        currentTownForCheckIn.feature.visitCount = newCount;
        highlightCurrentTown(currentTownForCheckIn);

        currentTownForCheckIn.bindPopup(
            '<b>' + townName + '</b><br>' +
            'CHECK INしました！<br>' +
            '訪問回数：' + newCount + '回'
        ).openPopup();

        updateCheckInUI();

        alert(
            townName + ' にCHECK INしました！\n' +
            '訪問回数：' + newCount + '/5回'
        );
    }

    // ============================================================
    // 旧localStorage版からSupabaseへ移行
    // ============================================================
    function getOldLocalVisits() {
        try {
            return JSON.parse(
                localStorage.getItem(OLD_STORAGE_KEY)
            ) || {};
        } catch (e) {
            return {};
        }
    }

    function updateMigrationButton() {
        const button =
            document.getElementById('migrationButton');

        if (!button || !currentUser) return;

        const oldVisits = getOldLocalVisits();

        const hasOldVisits =
            Object.keys(oldVisits).some(function(name) {
                return Number(
                    oldVisits[name] && oldVisits[name].count
                ) > 0;
            });

        button.style.display =
            hasOldVisits ? 'inline-block' : 'none';
    }

    async function migrateLocalVisits() {
        if (!currentUser) return;

        const oldVisits = getOldLocalVisits();

        const townNames =
            Object.keys(oldVisits).filter(function(name) {
                return Number(
                    oldVisits[name] && oldVisits[name].count
                ) > 0;
            });

        if (townNames.length === 0) {
            alert(
                'この端末に移行できる旧Visit記録はありません'
            );
            updateMigrationButton();
            return;
        }

        const ok = confirm(
            'この端末に残っている旧Visit記録をSupabaseへ移行します。\n' +
            'すでにクラウドに記録がある町丁目は、Visit回数が多い方を残します。\n\n' +
            '実行しますか？'
        );

        if (!ok) return;

        const rows = [];

        for (const townName of townNames) {
            const localRecord = oldVisits[townName] || {};
            const cloudRecord = getVisitRecord(townName);

            const localCount =
                Math.min(Number(localRecord.count) || 0, 5);
            const cloudCount = cloudRecord.count;

            let count = Math.max(localCount, cloudCount);
            let lastDate = null;

            if (localCount > cloudCount) {
                lastDate =
                    localRecord.lastCheckInDate || null;
            } else if (cloudCount > localCount) {
                lastDate =
                    cloudRecord.lastCheckInDate || null;
            } else {
                const localDate =
                    localRecord.lastCheckInDate || '';
                const cloudDate =
                    cloudRecord.lastCheckInDate || '';

                lastDate =
                    localDate >= cloudDate
                        ? (localDate || null)
                        : (cloudDate || null);
            }

            rows.push({
                user_id: currentUser.id,
                area: AREA_ID,
                town_key: townName,
                town_name: townName,
                visit_count: count,
                last_checkin_date: lastDate,
                updated_at: new Date().toISOString()
            });
        }

        const { error } = await supabaseClient
            .from('town_visits')
            .upsert(
                rows,
                {
                    onConflict: 'user_id,area,town_key'
                }
            );

        if (error) {
            console.error(error);

            alert(
                '旧Visit記録の移行に失敗しました。\n' +
                '旧データは削除していません。'
            );
            return;
        }

        await loadVisitsFromSupabase();

        // 移行成功後も、念のため旧localStorageは自動削除しません。
        // 必要なら後で手動削除できます。
        document.getElementById('migrationButton').style.display =
            'none';

        alert(
            '旧Visit記録をSupabaseへ移行しました。\n' +
            '旧データは念のためこの端末にも残しています。'
        );
    }

    // ============================================================
    // 現在いる町丁目を強調
    // ============================================================
    function highlightCurrentTown(layer) {
        if (currentTownLayer && currentTownLayer !== layer) {
            const oldFeature = currentTownLayer.feature;
            const oldCount = oldFeature.visitCount || 0;

            currentTownLayer.setStyle({
                color: '#555',
                weight: 1,
                fillColor: colors[oldCount],
                fillOpacity: oldCount === 0 ? 0.5 : 0.7
            });
        }

        currentTownLayer = layer;

        const feature = layer.feature;
        const count = feature.visitCount || 0;

        layer.setStyle({
            color: '#0000ff',
            weight: 4,
            fillColor: colors[count],
            fillOpacity: 0.8
        });
    }

    // ============================================================
    // 現在地をリアルタイム追跡
    // ============================================================
    function getLocation() {
        if (!navigator.geolocation) {
            alert('このブラウザはGPSに対応していません');
            return;
        }

        document.getElementById('locationInfo').textContent =
            '現在地を追跡しています……';

        if (watchId !== null) {
            returnToCurrentLocation();
            return;
        }

        watchId = navigator.geolocation.watchPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const heading = position.coords.heading;

                lastLatitude = lat;
                lastLongitude = lng;

                if (
                    heading !== null &&
                    Number.isFinite(heading) &&
                    position.coords.speed !== 0
                ) {
                    lastHeading = heading;

                    if (
                        headingUpEnabled &&
                        typeof map.setHeading === 'function'
                    ) {
                        map.setHeading(heading, {
                            ease: 0.18,
                            deadzone: 1
                        });
                    }
                }

                if (!locationMarker) {
                    locationMarker =
                        L.marker([lat, lng])
                            .addTo(map)
                            .bindPopup('現在地');
                } else {
                    locationMarker.setLatLng([lat, lng]);
                }

                if (firstLocationUpdate) {
                    map.setView([lat, lng], 16);
                    firstLocationUpdate = false;
                }

                findCurrentTown(lat, lng);
            },

            function(error) {
                console.log('GPSエラー:', error);

                document.getElementById(
                    'locationInfo'
                ).textContent =
                    '現在地を取得できませんでした';

                alert(
                    '現在地を取得できませんでした。\n' +
                    'ブラウザの位置情報設定を確認してください。'
                );
            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    // ============================================================
    // 現在地へ戻る
    // 上部ボタンと地図内ボタンの両方から同じ関数を呼びます。
    // ============================================================
    function returnToCurrentLocation() {
        if (
            lastLatitude !== null &&
            lastLongitude !== null
        ) {
            map.setView(
                [lastLatitude, lastLongitude],
                16
            );
            return;
        }

        if (watchId === null) {
            getLocation();
        } else {
            alert(
                '現在地を取得中です。' +
                '少し待ってからもう一度押してください。'
            );
        }
    }

    // ============================================================
    // GPS位置から町丁目を探す
    // ============================================================
    function findCurrentTown(lat, lng) {
        if (!townLayer) {
            document.getElementById(
                'locationInfo'
            ).textContent =
                '町丁目データを読み込み中です……';
            return;
        }

        const point = turf.point([lng, lat]);
        let foundTown = null;

        townLayer.eachLayer(function(layer) {
            if (foundTown) return;

            const feature = layer.feature;

            if (
                turf.booleanPointInPolygon(
                    point,
                    feature
                )
            ) {
                foundTown = layer;
            }
        });

        if (foundTown) {
            const townName =
                foundTown.feature.properties.S_NAME;

            console.log(
                '現在いる町丁目:',
                townName
            );

            document.getElementById(
                'locationInfo'
            ).textContent =
                '現在地：' + townName;

            currentTownForCheckIn = foundTown;

            highlightCurrentTown(foundTown);
            updateCheckInUI();

            // GPS更新のたびにポップアップは自動表示しない。
        } else {
            console.log(
                '現在地は町丁目ポリゴンの外です'
            );

            document.getElementById(
                'locationInfo'
            ).textContent =
                '現在地：町丁目を特定できませんでした';

            currentTownForCheckIn = null;
            updateCheckInUI();
        }
    }

    // ============================================================
    // 起動
    // ============================================================

    // ============================================================
    // 歩数・健康管理（歩数はSTEP HIGHERから読み取り専用）
    // ============================================================
    let healthSteps = {}, healthNotes = {}, healthGoals = [];
    let healthMonth = new Date(); healthMonth.setDate(1);
    let healthSelectedDate = null;
    let stepsChartInstance = null, weightChartInstance = null;
    const HEALTH_START = '2026-01-01';
    const fmtDate = d => [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
    const dateFrom = s => new Date(Number(s.slice(0,4)),Number(s.slice(5,7))-1,Number(s.slice(8,10)));
    const addDays = (d,n) => {const x=new Date(d);x.setDate(x.getDate()+n);return x;};
    const yesterday = () => fmtDate(addDays(new Date(),-1));
    const nfmt = n => Number(n).toLocaleString('ja-JP');
    const dayGoal = date => {let g=5000; for(const r of healthGoals){if(r.effective_date<=date)g=r.goal_steps;else break;}return g;};
    function switchTab(tab){
        const isHealth=tab==='health';
        document.getElementById('mapWrap').classList.toggle('hidden',isHealth);
        document.getElementById('healthWrap').classList.toggle('active',isHealth);
        document.getElementById('mapTab').classList.toggle('active',!isHealth);
        document.getElementById('healthTab').classList.toggle('active',isHealth);
        closeSettings();
        if(isHealth) {renderHealth();if(currentUser)loadHealthData();}
        else setTimeout(()=>map.invalidateSize(),50);
    }
    function toggleHealthSettings(){const e=document.getElementById('healthSettings');e.style.display=e.style.display==='block'?'none':'block';document.getElementById('healthGoalInput').value=dayGoal(fmtDate(new Date()));}
    async function loadHealthData(){
        if(!currentUser)return;
        const message=document.getElementById('healthMessage');message.textContent='データを取得中…';
        try{
            const [notes,goals]=await Promise.all([
                supabaseClient.from('health_daily_notes').select('entry_date,weight_kg,memo').gte('entry_date',HEALTH_START),
                supabaseClient.from('health_step_goals').select('effective_date,goal_steps').order('effective_date',{ascending:true})
            ]);
            if(notes.error)throw notes.error;if(goals.error)throw goals.error;
            healthNotes=Object.fromEntries((notes.data||[]).map(r=>[r.entry_date,r]));
            healthGoals=goals.data||[];
            if(!STEP_READ_FUNCTION_URL){message.textContent='歩数連携のURLが未設定です。体重・メモは利用できます。';healthSteps={};}
            else{
                const {data:{session}}=await supabaseClient.auth.getSession();
                if(!session)throw new Error('ログインし直してください');
                const res=await fetch(STEP_READ_FUNCTION_URL,{headers:{'Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_KEY}});
                if(!res.ok)throw new Error('歩数取得エラー（HTTP '+res.status+'）');
                const payload=await res.json();
                healthSteps=Object.fromEntries((payload.days||[]).map(r=>[r.step_date,Number(r.steps)]));
                message.textContent='歩数：'+Object.keys(healthSteps).length+'日分を取得しました（昨日まで）';
            }
        }catch(e){console.error(e);message.textContent='読み込みに失敗しました：'+e.message;}
        renderHealth();
    }
    function renderHealth(){
        const today=fmtDate(new Date()),last=yesterday();
        document.getElementById('healthGoalText').textContent='目標 '+nfmt(dayGoal(today))+'歩/日';
        document.getElementById('healthMonthLabel').textContent=healthMonth.getFullYear()+'年'+(healthMonth.getMonth()+1)+'月';
        const cal=document.getElementById('healthCalendar');cal.replaceChildren();
        ['日','月','火','水','木','金','土'].forEach(w=>{const el=document.createElement('div');el.className='health-week';el.textContent=w;cal.append(el);});
        const first=new Date(healthMonth.getFullYear(),healthMonth.getMonth(),1);
        for(let i=0;i<first.getDay();i++)cal.append(document.createElement('div'));
        const count=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
        for(let i=1;i<=count;i++){
            const d=fmtDate(new Date(first.getFullYear(),first.getMonth(),i));const step=healthSteps[d],note=healthNotes[d];
            const b=document.createElement('button');b.className='health-day';b.disabled=d>today||d<HEALTH_START;
            if(d<=last&&step!==undefined&&step>=dayGoal(d))b.classList.add('achieved');
            if(d===healthSelectedDate)b.classList.add('selected');
            const number=document.createElement('span');number.textContent=i;b.append(number);
            const value=document.createElement('span');value.className='step';value.textContent=d===today?'':step===undefined?'―':nfmt(step);b.append(value);
            const sub=document.createElement('span');sub.className='health-sub';sub.textContent=(note?.weight_kg!=null?Number(note.weight_kg).toFixed(1)+'kg ':'')+(note?.memo?'📝':'');b.append(sub);
            b.onclick=()=>openHealthDay(d);cal.append(b);
        }
        const stat=document.getElementById('healthStats');stat.replaceChildren();
        const dates=Object.keys(healthSteps).filter(d=>d>=HEALTH_START&&d<=last).sort();
        const currentMonth=fmtDate(new Date(new Date().getFullYear(),new Date().getMonth(),1));
        const currentYear=String(new Date().getFullYear())+'-01-01';
        const statCard=(label,val)=>{const div=document.createElement('div');div.className='health-stat';const small=document.createElement('small');small.textContent=label;const strong=document.createElement('strong');strong.textContent=val;div.append(small,strong);stat.append(div);};
        const avg=(from)=>{const a=dates.filter(d=>d>=from);return a.length?nfmt(Math.round(a.reduce((t,d)=>t+healthSteps[d],0)/a.length))+'歩':'―';};
        statCard('直近7日 平均',avg(fmtDate(addDays(new Date(),-7))));
        statCard('直近30日 平均',avg(fmtDate(addDays(new Date(),-30))));
        statCard('今月 平均',avg(currentMonth));statCard('今年 平均',avg(currentYear));
        const annual=dates.filter(d=>d>=currentYear);
        if(annual.length){
            const max=annual.reduce((a,b)=>healthSteps[a]>=healthSteps[b]?a:b);
            const min=annual.reduce((a,b)=>healthSteps[a]<=healthSteps[b]?a:b);
            statCard('今年最多',nfmt(healthSteps[max])+'歩 ('+max.slice(5)+')');
            statCard('今年最少',nfmt(healthSteps[min])+'歩 ('+min.slice(5)+')');
            const hits=annual.filter(d=>healthSteps[d]>=dayGoal(d)).length;
            statCard('今年の目標達成率',Math.round(100*hits/annual.length)+'% ('+hits+'/'+annual.length+'日)');
        }else{statCard('今年最多・最少','―');statCard('今年の目標達成率','―');}
        let streak=0;for(let d=last;d>=HEALTH_START;d=fmtDate(addDays(dateFrom(d),-1))){if(healthSteps[d]===undefined||healthSteps[d]<dayGoal(d))break;streak++;}
        statCard('連続目標達成（昨日まで）',streak+'日');
        renderHealthCharts();
    }
    function moveHealthMonth(delta){healthMonth.setMonth(healthMonth.getMonth()+delta);renderHealth();}
    function openHealthDay(d){healthSelectedDate=d;const r=healthNotes[d]||{};document.getElementById('healthDetail').style.display='block';document.getElementById('healthDetailTitle').textContent=d+' の記録';document.getElementById('healthDetailSteps').textContent=d===fmtDate(new Date())?'歩数：今日の歩数は非表示':'歩数：'+(healthSteps[d]===undefined?'記録なし':nfmt(healthSteps[d])+'歩（目標 '+nfmt(dayGoal(d))+'歩）');document.getElementById('healthWeight').value=r.weight_kg??'';document.getElementById('healthMemo').value=r.memo||'';renderHealth();document.getElementById('healthDetail').scrollIntoView({behavior:'smooth',block:'nearest'});}
    async function saveHealthNote(){
        if(!currentUser||!healthSelectedDate)return alert('ログインしてください');
        const v=document.getElementById('healthWeight').value.trim(),memo=document.getElementById('healthMemo').value.trim();
        if(v!==''&&(!Number.isFinite(Number(v))||Number(v)<1||Number(v)>999.9||!/^\d+(\.\d)?$/.test(v)))return alert('体重は1～999.9kg、小数1桁で入力してください');
        if(!v&&!memo)return deleteHealthNote();
        const {error}=await supabaseClient.from('health_daily_notes').upsert({user_id:currentUser.id,entry_date:healthSelectedDate,weight_kg:v===''?null:Number(v),memo:memo||null},{onConflict:'user_id,entry_date'});
        if(error)return alert('保存失敗：'+error.message);
        healthNotes[healthSelectedDate]={entry_date:healthSelectedDate,weight_kg:v===''?null:Number(v),memo:memo||null};renderHealth();alert('保存しました');
    }
    async function deleteHealthNote(){
        if(!currentUser||!healthSelectedDate)return;
        if(!confirm(healthSelectedDate+' の体重とメモを削除しますか？'))return;
        const {error}=await supabaseClient.from('health_daily_notes').delete().eq('entry_date',healthSelectedDate).eq('user_id',currentUser.id);
        if(error)return alert('削除失敗：'+error.message);
        delete healthNotes[healthSelectedDate];document.getElementById('healthDetail').style.display='none';renderHealth();
    }
    async function saveHealthGoal(){
        if(!currentUser)return alert('ログインしてください');
        const goal=Number(document.getElementById('healthGoalInput').value);
        if(!Number.isInteger(goal)||goal<1||goal>100000)return alert('目標は1～100,000歩で指定してください');
        const today=fmtDate(new Date());
        const {error}=await supabaseClient.from('health_step_goals').upsert({user_id:currentUser.id,effective_date:today,goal_steps:goal},{onConflict:'user_id,effective_date'});
        if(error)return alert('保存失敗：'+error.message);
        healthGoals=healthGoals.filter(r=>r.effective_date!==today).concat([{effective_date:today,goal_steps:goal}]).sort((a,b)=>a.effective_date.localeCompare(b.effective_date));
        document.getElementById('healthSettings').style.display='none';renderHealth();alert('今日からの目標を変更しました');
    }
    function renderHealthCharts(){
        if(typeof Chart==='undefined')return;
        const last=yesterday(),today=new Date();
        const stepPeriod=document.getElementById('stepChartPeriod').value;
        const start=stepPeriod==='month'?fmtDate(new Date(today.getFullYear(),today.getMonth(),1)):fmtDate(addDays(today,-30));
        const stepDates=[];for(let d=start;d<=last;d=fmtDate(addDays(dateFrom(d),1)))stepDates.push(d);
        if(stepsChartInstance)stepsChartInstance.destroy();
        stepsChartInstance=new Chart(document.getElementById('stepsChart'),{type:document.getElementById('stepChartType').value,data:{labels:stepDates.map(d=>d.slice(5)),datasets:[{label:'歩数',data:stepDates.map(d=>healthSteps[d]??null),backgroundColor:'#5695cb',borderColor:'#377dbb',borderWidth:2,spanGaps:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
        const period=document.getElementById('weightChartPeriod').value;
        const weightStart=period==='month'?fmtDate(new Date(today.getFullYear(),today.getMonth(),1)):period==='year'?fmtDate(new Date(today.getFullYear(),0,1)):fmtDate(addDays(today,-29));
        const weightDates=Object.keys(healthNotes).filter(d=>d>=weightStart&&d<=fmtDate(today)&&healthNotes[d].weight_kg!=null).sort();
        const vals=weightDates.map(d=>Number(healthNotes[d].weight_kg));
        document.getElementById('weightStats').textContent=vals.length?'平均 '+(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)+'kg ／ 最小 '+Math.min(...vals).toFixed(1)+'kg ／ 最大 '+Math.max(...vals).toFixed(1)+'kg（'+vals.length+'日分）':'体重の記録がありません';
        if(weightChartInstance)weightChartInstance.destroy();
        weightChartInstance=new Chart(document.getElementById('weightChart'),{type:'line',data:{labels:weightDates.map(d=>d.slice(5)),datasets:[{label:'体重 kg',data:vals,borderColor:'#db7c7c',backgroundColor:'#db7c7c',pointRadius:3,tension:0.2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{title:{display:true,text:'kg'}}}}});
    }

    initializeAuth();
</script>
