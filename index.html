<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>町丁目制覇</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body {
            font-family: sans-serif;
            margin: 8px;
        }

        #map {
            height: 85vh;
        }

        button, input {
            font-size: 16px;
            padding: 9px 12px;
            margin: 3px 2px 7px 0;
        }

        #titleRow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        #titleRow h2 {
            margin: 0 0 8px 0;
        }

        #settingsButton {
            width: 42px;
            height: 42px;
            margin: 0 0 8px 0;
            padding: 0;
            border: 1px solid #bbb;
            border-radius: 8px;
            background: #fff;
            font-size: 23px;
            line-height: 40px;
            cursor: pointer;
            touch-action: manipulation;
        }

        #authBox {
            margin-bottom: 8px;
        }

        #authStatus {
            margin-bottom: 6px;
            font-size: 14px;
        }

        #settingsPanel {
            display: none;
            margin: 4px 0 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f7f7f7;
        }

        #settingsPanel.open {
            display: block;
        }

        #migrationArea {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
        }

        #locationInfo, #checkInStatus {
            margin-bottom: 8px;
        }

        #locationInfo {
            font-size: 18px;
        }

        #checkInStatus {
            font-size: 16px;
        }

        /* 地図内に常時表示する「現在地に戻る」ボタン */
        .leaflet-control-current-location {
            background: #fff;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.35);

            /* iPhone Safariの下部メニューと重ならないよう上へ移動 */
            margin-bottom: calc(90px + env(safe-area-inset-bottom)) !important;
        }

        .leaflet-control-current-location button {
            display: block;
            width: 44px;
            height: 44px;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 3px;
            background: #fff;
            font-size: 25px;
            line-height: 44px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .leaflet-control-current-location button:active {
            background: #eee;
        }

        /* ページ最上部へ戻るボタン */
        .leaflet-control-page-top {
            background: #fff;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.35);
        }

        .leaflet-control-page-top button {
            display: block;
            width: 44px;
            height: 44px;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 3px;
            background: #fff;
            font-size: 26px;
            font-weight: bold;
            line-height: 44px;
            cursor: pointer;
        }

        .leaflet-control-page-top button:active {
            background: #eee;
        }

        /* 町丁目の訪問色レイヤー ON/OFF ボタン */
        .leaflet-control-visit-layer {
            background: #fff;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.35);
        }

        .leaflet-control-visit-layer button {
            display: block;
            min-width: 52px;
            height: 44px;
            margin: 0;
            padding: 0 7px;
            border: 0;
            border-radius: 3px;
            background: #fff;
            font-size: 13px;
            font-weight: bold;
            line-height: 44px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .leaflet-control-visit-layer button:active {
            background: #eee;
        }
    </style>
</head>

<body>

<div id="titleRow">
    <h2>町丁目制覇</h2>
    <button id="settingsButton" type="button" onclick="toggleSettings()"
            aria-label="設定" title="設定">⚙</button>
</div>

<div id="authBox">
    <div id="authStatus">Supabaseに接続中...</div>

    <div id="loginForm">
        <input id="email" type="email" autocomplete="username" placeholder="メールアドレス">
        <input id="password" type="password" autocomplete="current-password" placeholder="パスワード">
        <button onclick="login()">ログイン</button>
    </div>

    <div id="settingsPanel">
        <div id="loggedInControls" style="display:none;">
            <button onclick="logout()">ログアウト</button>

            <div id="migrationArea">
                <button id="migrationButton" onclick="migrateLocalVisits()" style="display:none;">
                    この端末の旧Visit記録を移行
                </button>
            </div>
        </div>
    </div>
</div>

<button onclick="getLocation()">現在地の追跡を開始</button>
<button onclick="returnToCurrentLocation()">現在地に戻る</button>

<div id="locationInfo">現在地：まだ取得していません</div>
<button id="checkInButton" onclick="checkIn()" disabled>CHECK IN</button>
<div id="checkInStatus">ログインするとチェックインできます</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ============================================================
    // Supabase設定
    // この2か所だけ、自分のSupabaseの値に置き換えてください。
    // Secret key / service_role key は絶対に入れないでください。
    // ============================================================
    const SUPABASE_URL = 'https://zinykdjisortaxuixnbi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2yG5Wf27ihXU1QDqCr3c-w_N8M-ZNp3';

    const AREA_ID = 'tama';
    const OLD_STORAGE_KEY = 'townCheckinVisitsV1';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let visits = {};
    let townLayer = null;
    let currentTownForCheckIn = null;
    let currentTownLayer = null;

    let locationMarker = null;
    let watchId = null;
    let firstLocationUpdate = true;
    let lastLatitude = null;
    let lastLongitude = null;

    // 訪問色付き町丁目レイヤーの表示状態
    let visitLayerVisible = true;
    let visitLayerToggleButton = null;

    const colors = [
        '#ffffff',
        '#90ee90',
        '#87ceeb',
        '#ffff66',
        '#ffb347',
        '#ff6666'
    ];

    // ============================================================
    // 地図
    // ============================================================
    const map = L.map('map').setView([35.63, 139.43], 13);

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    // ============================================================
    // 地図内の「現在地に戻る」ボタン
    // 地図を画面いっぱいに表示しても常に右下に残ります。
    // ============================================================
    const CurrentLocationControl = L.Control.extend({
        options: {
            position: 'bottomright'
        },

        onAdd: function() {
            const container = L.DomUtil.create(
                'div',
                'leaflet-control-current-location'
            );

            const button = L.DomUtil.create('button', '', container);
            button.type = 'button';
            button.innerHTML = '◎';
            button.title = '現在地に戻る';
            button.setAttribute('aria-label', '現在地に戻る');

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);

            L.DomEvent.on(button, 'click', function(e) {
                L.DomEvent.stop(e);
                returnToCurrentLocation();
            });

            return container;
        }
    });

    map.addControl(new CurrentLocationControl());

    // ============================================================
    // 地図内の「ページ最上部へ戻る」ボタン
    // 地図を大きく表示して上部の操作部分が見えなくなっても、
    // この ↑ を押せばページを最初の位置まで戻せます。
    // ============================================================
    const PageTopControl = L.Control.extend({
        options: {
            position: 'bottomright'
        },

        onAdd: function() {
            const container = L.DomUtil.create(
                'div',
                'leaflet-control-page-top'
            );

            const button = L.DomUtil.create('button', '', container);
            button.type = 'button';
            button.innerHTML = '↑';
            button.title = 'ページの一番上へ戻る';
            button.setAttribute('aria-label', 'ページの一番上へ戻る');

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);

            L.DomEvent.on(button, 'click', function(e) {
                L.DomEvent.stop(e);
                window.scrollTo({
                    top: 0,
                    left: 0,
                    behavior: 'smooth'
                });
            });

            return container;
        }
    });

    map.addControl(new PageTopControl());

    // ============================================================
    // 地図内の「訪問色レイヤー ON/OFF」ボタン
    // 道路・店名などを見やすくしたいときに町丁目レイヤーを隠せます。
    // 再度ONにすると、訪問回数の色・現在地の強調もそのまま復元します。
    // ============================================================
    const VisitLayerControl = L.Control.extend({
        options: {
            position: 'bottomright'
        },

        onAdd: function() {
            const container = L.DomUtil.create(
                'div',
                'leaflet-control-visit-layer'
            );

            const button = L.DomUtil.create('button', '', container);
            button.type = 'button';
            button.title = '訪問色レイヤーを表示・非表示';
            button.setAttribute(
                'aria-label',
                '訪問色レイヤーを表示・非表示'
            );

            visitLayerToggleButton = button;
            updateVisitLayerButton();

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);

            L.DomEvent.on(button, 'click', function(e) {
                L.DomEvent.stop(e);
                toggleVisitLayer();
            });

            return container;
        }
    });

    map.addControl(new VisitLayerControl());

    function updateVisitLayerButton() {
        if (!visitLayerToggleButton) return;

        visitLayerToggleButton.textContent =
            visitLayerVisible ? '色 OFF' : '色 ON';

        visitLayerToggleButton.title =
            visitLayerVisible
                ? '訪問色レイヤーを隠す'
                : '訪問色レイヤーを表示する';
    }

    function toggleVisitLayer() {
        if (!townLayer) return;

        if (visitLayerVisible) {
            map.removeLayer(townLayer);
            visitLayerVisible = false;
        } else {
            townLayer.addTo(map);
            visitLayerVisible = true;

            // 表示を戻したとき、Visit色と現在地の強調を最新状態にする。
            refreshAllTownStyles();
        }

        updateVisitLayerButton();
    }

    // ============================================================
    // Visitデータ
    // ============================================================
    function getVisitRecord(townName) {
        const r = visits[townName] || {};
        return {
            count: Math.min(Number(r.count) || 0, 5),
            lastCheckInDate: r.lastCheckInDate || null
        };
    }

    function getTodayString() {
        const d = new Date();
        return d.getFullYear() + '-' +
            String(d.getMonth() + 1).padStart(2, '0') + '-' +
            String(d.getDate()).padStart(2, '0');
    }

    function normalStyle(feature) {
        const record = getVisitRecord(feature.properties.S_NAME);
        feature.visitCount = record.count;

        return {
            color: '#555',
            weight: 1,
            fillColor: colors[record.count],
            fillOpacity: record.count === 0 ? 0.5 : 0.7
        };
    }

    function onEachFeature(feature, layer) {
        const townName = feature.properties.S_NAME;
        feature.visitCount = getVisitRecord(townName).count;

        layer.on('click', function() {
            const record = getVisitRecord(townName);

            layer.bindPopup(
                '<b>' + townName + '</b><br>' +
                '訪問回数：' + record.count + '回'
            ).openPopup();
        });
    }

    function refreshAllTownStyles() {
        if (!townLayer) return;

        townLayer.eachLayer(function(layer) {
            const townName = layer.feature.properties.S_NAME;
            const count = getVisitRecord(townName).count;

            layer.feature.visitCount = count;

            layer.setStyle({
                color: layer === currentTownLayer ? '#0000ff' : '#555',
                weight: layer === currentTownLayer ? 4 : 1,
                fillColor: colors[count],
                fillOpacity: layer === currentTownLayer
                    ? 0.8
                    : (count === 0 ? 0.5 : 0.7)
            });
        });
    }

    // ============================================================
    // GeoJSON
    // ============================================================
    fetch('towns.geojson')
        .then(response => {
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            return response.json();
        })
        .then(data => {
            townLayer = L.geoJSON(data, {
                style: normalStyle,
                onEachFeature: onEachFeature
            }).addTo(map);

            refreshAllTownStyles();
        })
        .catch(error => {
            console.error('GeoJSONの読み込みに失敗しました:', error);
            alert('towns.geojsonを読み込めませんでした');
        });

    // ============================================================
    // 設定パネル
    // ============================================================
    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');

        // 未ログイン時はログイン欄が通常表示されるため、
        // 設定パネルにはログイン後専用の操作だけを置きます。
        if (!currentUser) {
            alert('現在はログインしていません');
            return;
        }

        panel.classList.toggle('open');
    }

    function closeSettings() {
        document.getElementById('settingsPanel').classList.remove('open');
    }

    // ============================================================
    // Supabase認証
    // ============================================================
    async function initializeAuth() {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) {
            console.error(error);
            document.getElementById('authStatus').textContent =
                'ログイン状態を確認できませんでした';
            return;
        }

        await applySession(data.session);

        supabaseClient.auth.onAuthStateChange((event, session) => {
            setTimeout(function() {
                applySession(session);
            }, 0);
        });
    }

    async function applySession(session) {
        currentUser = session ? session.user : null;

        const loginForm = document.getElementById('loginForm');
        const loggedInControls =
            document.getElementById('loggedInControls');
        const authStatus = document.getElementById('authStatus');

        if (currentUser) {
            loginForm.style.display = 'none';
            loggedInControls.style.display = 'block';

            // メールアドレスは通常画面には表示しません。
            authStatus.textContent = '● ログイン済み';

            await loadVisitsFromSupabase();
            updateMigrationButton();
        } else {
            visits = {};
            loginForm.style.display = 'block';
            loggedInControls.style.display = 'none';
            authStatus.textContent = 'ログインしてください';
            closeSettings();

            refreshAllTownStyles();
            updateCheckInUI();
        }
    }

    async function login() {
        const email =
            document.getElementById('email').value.trim();
        const password =
            document.getElementById('password').value;

        if (!email || !password) {
            alert('メールアドレスとパスワードを入力してください');
            return;
        }

        document.getElementById('authStatus').textContent =
            'ログイン中...';

        const { error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            console.error(error);
            document.getElementById('authStatus').textContent =
                'ログインに失敗しました';

            alert(
                'ログインできませんでした。\n' +
                'メールアドレスとパスワードを確認してください。'
            );
        }
    }

    async function logout() {
        closeSettings();

        const { error } = await supabaseClient.auth.signOut();

        if (error) {
            console.error(error);
            alert('ログアウトに失敗しました');
        }
    }

    // ============================================================
    // SupabaseからVisit記録を読む
    // ============================================================
    async function loadVisitsFromSupabase() {
        if (!currentUser) return;

        document.getElementById('checkInStatus').textContent =
            'Visit記録を読み込み中...';

        const { data, error } = await supabaseClient
            .from('town_visits')
            .select(
                'town_key, town_name, visit_count, last_checkin_date'
            )
            .eq('area', AREA_ID);

        if (error) {
            console.error(error);

            alert(
                'Visit記録を読み込めませんでした。\n' +
                'Supabaseの設定を確認してください。'
            );

            updateCheckInUI();
            return;
        }

        visits = {};

        for (const row of data) {
            visits[row.town_key] = {
                count: Math.min(Number(row.visit_count) || 0, 5),
                lastCheckInDate: row.last_checkin_date || null
            };
        }

        refreshAllTownStyles();
        updateCheckInUI();
    }

    // ============================================================
    // CHECK IN
    // ============================================================
    function updateCheckInUI() {
        const button =
            document.getElementById('checkInButton');
        const status =
            document.getElementById('checkInStatus');

        if (!currentUser) {
            button.disabled = true;
            status.textContent =
                'ログインするとチェックインできます';
            return;
        }

        if (!currentTownForCheckIn) {
            button.disabled = true;
            status.textContent =
                '現在地を取得するとチェックインできます';
            return;
        }

        const townName =
            currentTownForCheckIn.feature.properties.S_NAME;
        const record = getVisitRecord(townName);
        const today = getTodayString();

        if (record.count >= 5) {
            button.disabled = true;
            status.textContent =
                townName + '：5回達成済みです';
        } else if (record.lastCheckInDate === today) {
            button.disabled = true;
            status.textContent =
                townName +
                '：今日はCHECK IN済みです（' +
                record.count + '/5回）';
        } else {
            button.disabled = false;
            status.textContent =
                townName +
                '：CHECK INできます（現在 ' +
                record.count + '/5回）';
        }
    }

    async function checkIn() {
        if (!currentUser || !currentTownForCheckIn) return;

        const button =
            document.getElementById('checkInButton');
        const townName =
            currentTownForCheckIn.feature.properties.S_NAME;
        const record = getVisitRecord(townName);
        const today = getTodayString();

        if (
            record.count >= 5 ||
            record.lastCheckInDate === today
        ) {
            updateCheckInUI();
            return;
        }

        button.disabled = true;

        document.getElementById('checkInStatus').textContent =
            townName + '：保存中...';

        const newCount = record.count + 1;

        const { error } = await supabaseClient
            .from('town_visits')
            .upsert(
                {
                    user_id: currentUser.id,
                    area: AREA_ID,
                    town_key: townName,
                    town_name: townName,
                    visit_count: newCount,
                    last_checkin_date: today,
                    updated_at: new Date().toISOString()
                },
                {
                    onConflict: 'user_id,area,town_key'
                }
            );

        if (error) {
            console.error(error);

            alert(
                'CHECK INを保存できませんでした。\n' +
                '通信状態を確認して、もう一度試してください。'
            );

            updateCheckInUI();
            return;
        }

        visits[townName] = {
            count: newCount,
            lastCheckInDate: today
        };

        currentTownForCheckIn.feature.visitCount = newCount;
        highlightCurrentTown(currentTownForCheckIn);

        currentTownForCheckIn.bindPopup(
            '<b>' + townName + '</b><br>' +
            'CHECK INしました！<br>' +
            '訪問回数：' + newCount + '回'
        ).openPopup();

        updateCheckInUI();

        alert(
            townName + ' にCHECK INしました！\n' +
            '訪問回数：' + newCount + '/5回'
        );
    }

    // ============================================================
    // 旧localStorage版からSupabaseへ移行
    // ============================================================
    function getOldLocalVisits() {
        try {
            return JSON.parse(
                localStorage.getItem(OLD_STORAGE_KEY)
            ) || {};
        } catch (e) {
            return {};
        }
    }

    function updateMigrationButton() {
        const button =
            document.getElementById('migrationButton');

        if (!button || !currentUser) return;

        const oldVisits = getOldLocalVisits();

        const hasOldVisits =
            Object.keys(oldVisits).some(function(name) {
                return Number(
                    oldVisits[name] && oldVisits[name].count
                ) > 0;
            });

        button.style.display =
            hasOldVisits ? 'inline-block' : 'none';
    }

    async function migrateLocalVisits() {
        if (!currentUser) return;

        const oldVisits = getOldLocalVisits();

        const townNames =
            Object.keys(oldVisits).filter(function(name) {
                return Number(
                    oldVisits[name] && oldVisits[name].count
                ) > 0;
            });

        if (townNames.length === 0) {
            alert(
                'この端末に移行できる旧Visit記録はありません'
            );
            updateMigrationButton();
            return;
        }

        const ok = confirm(
            'この端末に残っている旧Visit記録をSupabaseへ移行します。\n' +
            'すでにクラウドに記録がある町丁目は、Visit回数が多い方を残します。\n\n' +
            '実行しますか？'
        );

        if (!ok) return;

        const rows = [];

        for (const townName of townNames) {
            const localRecord = oldVisits[townName] || {};
            const cloudRecord = getVisitRecord(townName);

            const localCount =
                Math.min(Number(localRecord.count) || 0, 5);
            const cloudCount = cloudRecord.count;

            let count = Math.max(localCount, cloudCount);
            let lastDate = null;

            if (localCount > cloudCount) {
                lastDate =
                    localRecord.lastCheckInDate || null;
            } else if (cloudCount > localCount) {
                lastDate =
                    cloudRecord.lastCheckInDate || null;
            } else {
                const localDate =
                    localRecord.lastCheckInDate || '';
                const cloudDate =
                    cloudRecord.lastCheckInDate || '';

                lastDate =
                    localDate >= cloudDate
                        ? (localDate || null)
                        : (cloudDate || null);
            }

            rows.push({
                user_id: currentUser.id,
                area: AREA_ID,
                town_key: townName,
                town_name: townName,
                visit_count: count,
                last_checkin_date: lastDate,
                updated_at: new Date().toISOString()
            });
        }

        const { error } = await supabaseClient
            .from('town_visits')
            .upsert(
                rows,
                {
                    onConflict: 'user_id,area,town_key'
                }
            );

        if (error) {
            console.error(error);

            alert(
                '旧Visit記録の移行に失敗しました。\n' +
                '旧データは削除していません。'
            );
            return;
        }

        await loadVisitsFromSupabase();

        // 移行成功後も、念のため旧localStorageは自動削除しません。
        // 必要なら後で手動削除できます。
        document.getElementById('migrationButton').style.display =
            'none';

        alert(
            '旧Visit記録をSupabaseへ移行しました。\n' +
            '旧データは念のためこの端末にも残しています。'
        );
    }

    // ============================================================
    // 現在いる町丁目を強調
    // ============================================================
    function highlightCurrentTown(layer) {
        if (currentTownLayer && currentTownLayer !== layer) {
            const oldFeature = currentTownLayer.feature;
            const oldCount = oldFeature.visitCount || 0;

            currentTownLayer.setStyle({
                color: '#555',
                weight: 1,
                fillColor: colors[oldCount],
                fillOpacity: oldCount === 0 ? 0.5 : 0.7
            });
        }

        currentTownLayer = layer;

        const feature = layer.feature;
        const count = feature.visitCount || 0;

        layer.setStyle({
            color: '#0000ff',
            weight: 4,
            fillColor: colors[count],
            fillOpacity: 0.8
        });
    }

    // ============================================================
    // 現在地をリアルタイム追跡
    // ============================================================
    function getLocation() {
        if (!navigator.geolocation) {
            alert('このブラウザはGPSに対応していません');
            return;
        }

        document.getElementById('locationInfo').textContent =
            '現在地を追跡しています……';

        if (watchId !== null) {
            returnToCurrentLocation();
            return;
        }

        watchId = navigator.geolocation.watchPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                lastLatitude = lat;
                lastLongitude = lng;

                if (!locationMarker) {
                    locationMarker =
                        L.marker([lat, lng])
                            .addTo(map)
                            .bindPopup('現在地');
                } else {
                    locationMarker.setLatLng([lat, lng]);
                }

                if (firstLocationUpdate) {
                    map.setView([lat, lng], 16);
                    firstLocationUpdate = false;
                }

                findCurrentTown(lat, lng);
            },

            function(error) {
                console.log('GPSエラー:', error);

                document.getElementById(
                    'locationInfo'
                ).textContent =
                    '現在地を取得できませんでした';

                alert(
                    '現在地を取得できませんでした。\n' +
                    'ブラウザの位置情報設定を確認してください。'
                );
            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    // ============================================================
    // 現在地へ戻る
    // 上部ボタンと地図内ボタンの両方から同じ関数を呼びます。
    // ============================================================
    function returnToCurrentLocation() {
        if (
            lastLatitude !== null &&
            lastLongitude !== null
        ) {
            map.setView(
                [lastLatitude, lastLongitude],
                16
            );
            return;
        }

        if (watchId === null) {
            getLocation();
        } else {
            alert(
                '現在地を取得中です。' +
                '少し待ってからもう一度押してください。'
            );
        }
    }

    // ============================================================
    // GPS位置から町丁目を探す
    // ============================================================
    function findCurrentTown(lat, lng) {
        if (!townLayer) {
            document.getElementById(
                'locationInfo'
            ).textContent =
                '町丁目データを読み込み中です……';
            return;
        }

        const point = turf.point([lng, lat]);
        let foundTown = null;

        townLayer.eachLayer(function(layer) {
            if (foundTown) return;

            const feature = layer.feature;

            if (
                turf.booleanPointInPolygon(
                    point,
                    feature
                )
            ) {
                foundTown = layer;
            }
        });

        if (foundTown) {
            const townName =
                foundTown.feature.properties.S_NAME;

            console.log(
                '現在いる町丁目:',
                townName
            );

            document.getElementById(
                'locationInfo'
            ).textContent =
                '現在地：' + townName;

            currentTownForCheckIn = foundTown;

            highlightCurrentTown(foundTown);
            updateCheckInUI();

            // GPS更新のたびにポップアップは自動表示しない。
        } else {
            console.log(
                '現在地は町丁目ポリゴンの外です'
            );

            document.getElementById(
                'locationInfo'
            ).textContent =
                '現在地：町丁目を特定できませんでした';

            currentTownForCheckIn = null;
            updateCheckInUI();
        }
    }

    // ============================================================
    // 起動
    // ============================================================
    initializeAuth();
</script>

</html>
