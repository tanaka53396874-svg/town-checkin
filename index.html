<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>町丁目制覇</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/@tomickigrzegorz/leaflet-rotate@0.2.4/dist/leaflet-rotate.css"/>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* 上部の白背景は最小限。通常時は約44pxだけ使用 */
        #topBar {
            position: relative;
            z-index: 1200;
            flex: 0 0 auto;
            min-height: 44px;
            padding: 4px 8px;
            box-sizing: border-box;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }

        #mapWrap {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
        }

        #map {
            position: absolute;
            inset: 0;
            height: 100%;
            width: 100%;
        }

        /* 地図上に重ねる主要操作 */
        #mapMainControls {
            position: absolute;
            z-index: 1000;
            left: 10px;
            top: 10px;
            display: flex;
            gap: 7px;
            align-items: center;
            pointer-events: auto;
        }

        #mapMainControls button {
            margin: 0;
            min-height: 44px;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.94);
            box-shadow: 0 1px 5px rgba(0,0,0,0.30);
            font-weight: bold;
            touch-action: manipulation;
        }

        #checkInButton:not(:disabled) {
            background: rgba(255,255,255,0.97);
        }

        #mapInfoPanel {
            position: absolute;
            z-index: 999;
            left: 10px;
            top: 62px;
            max-width: calc(100% - 80px);
            padding: 5px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.86);
            box-shadow: 0 1px 4px rgba(0,0,0,0.18);
            pointer-events: none;
        }

        #mapInfoPanel #locationInfo,
        #mapInfoPanel #checkInStatus {
            margin: 0;
            font-size: 13px;
            line-height: 1.35;
        }

        #mapInfoPanel #locationInfo {
            font-weight: bold;
        }

        button, input {
            font-size: 16px;
            padding: 9px 12px;
            margin: 3px 2px 7px 0;
        }

        #titleRow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            min-height: 36px;
        }

        #titleRow h2 {
            margin: 0;
            font-size: 16px;
            white-space: nowrap;
        }

        #areaSelect {
            min-height: 34px;
            max-width: 90px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: white;
            font-size: 13px;
        }

        #headerRight {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        #settingsButton {
            width: 36px;
            height: 36px;
            margin: 0;
            padding: 0;
            border: 1px solid #bbb;
            border-radius: 8px;
            background: #fff;
            font-size: 23px;
            line-height: 34px;
            cursor: pointer;
            touch-action: manipulation;
        }

        #authBox {
            margin: 0;
        }

        #authStatus {
            margin: 0;
            font-size: 13px;
            white-space: nowrap;
        }

        #loginForm {
            padding-top: 6px;
        }

        #settingsPanel {
            display: none;
            position: absolute;
            right: 8px;
            top: 44px;
            width: min(310px, calc(100vw - 16px));
            margin: 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f7f7f7;
        }

        #settingsPanel.open {
            display: block;
        }

        #migrationArea {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid #ddd;
        }

        #locationInfo, #checkInStatus {
            margin: 0;
        }

        /* 地図内に常時表示する「現在地に戻る」ボタン */
        .leaflet-control-current-location {
            background: #fff;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.35);

            /* iPhone Safariの下部メニューと重ならないよう上へ移動 */
            margin-bottom: calc(90px + env(safe-area-inset-bottom)) !important;
        }

        .leaflet-control-current-location button {
            display: block;
            width: 44px;
            height: 44px;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 3px;
            background: #fff;
            font-size: 25px;
            line-height: 44px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .leaflet-control-current-location button:active {
            background: #eee;
        }

        /* ページ最上部へ戻るボタン */
        .leaflet-control-page-top {
            background: #fff;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.35);
        }

        .leaflet-control-page-top button {
            display: block;
            width: 44px;
            height: 44px;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 3px;
            background: #fff;
            font-size: 26px;
            font-weight: bold;
            line-height: 44px;
            cursor: pointer;
        }

        .leaflet-control-page-top button:active {
            background: #eee;
        }

        /* 町丁目の訪問色レイヤー ON/OFF ボタン */
        .leaflet-control-visit-layer {
            background: #fff;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.35);
        }

        .leaflet-control-visit-layer button {
            display: block;
            min-width: 52px;
            height: 44px;
            margin: 0;
            padding: 0 7px;
            border: 0;
            border-radius: 3px;
            background: #fff;
            font-size: 13px;
            font-weight: bold;
            line-height: 44px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .leaflet-control-visit-layer button:active {
            background: #eee;
        }

        /* 進行方向を上にするモード */
        .leaflet-control-heading-up {
            background: #fff;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.35);
        }

        .leaflet-control-heading-up button {
            display: block;
            min-width: 58px;
            height: 44px;
            margin: 0;
            padding: 0 6px;
            border: 0;
            border-radius: 3px;
            background: #fff;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .leaflet-control-heading-up button.active {
            background: #dff1ff;
        }
    </style>
</head>

<body>

<div id="topBar">
    <div id="titleRow">
        <h2>町丁目制覇</h2>
<div id="headerRight">
            <div id="authStatus">Supabaseに接続中...</div>
            <button id="settingsButton" type="button" onclick="toggleSettings()"
                    aria-label="設定" title="設定">⚙</button>
        </div>
    </div>

    <div id="authBox">
        <div id="loginForm">
            <input id="email" type="email" autocomplete="username" placeholder="メールアドレス">
            <input id="password" type="password" autocomplete="current-password" placeholder="パスワード">
            <button onclick="login()">ログイン</button>
        </div>

        <div id="settingsPanel">
            <div id="loggedInControls" style="display:none;">
                <button onclick="logout()">ログアウト</button>

                <div id="migrationArea">
                    <button id="migrationButton" onclick="migrateLocalVisits()" style="display:none;">
                        この端末の旧Visit記録を移行
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="mapWrap">
    <div id="map"></div>

    <div id="mapMainControls">
        <button id="trackingButton" type="button" onclick="getLocation()">現在地の追跡を開始</button>
        <button id="checkInButton" onclick="checkIn()" disabled>CHECK IN</button>
    </div>

    <div id="mapInfoPanel">
        <div id="locationInfo">現在地：まだ取得していません</div>
        <div id="checkInStatus">ログインするとチェックインできます</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@tomickigrzegorz/leaflet-rotate@0.2.4/dist/leaflet-rotate.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // ============================================================
    // Supabase設定
    // この2か所だけ、自分のSupabaseの値に置き換えてください。
    // Secret key / service_role key は絶対に入れないでください。
    // ============================================================
  const SUPABASE_URL =
    "https://lodgpydrwbbqnogshjir.supabase.co/";

  const SUPABASE_KEY =
    "sb_publishable_2m9HkObR_Nf_-OxtpLHb4Q_-uROIako";

    const AREAS = {
        'tama': {
            label: '多摩市',
            file: 'towns.geojson',
            center: [35.63, 139.43],
            zoom: 13,
            oldStorageKey: 'townCheckinVisitsV1'
        },
        'chiba-city': {
            label: '千葉市',
            file: 'chiba-city/chiba-city-towns.geojson',
            center: [35.6074, 140.1065],
            zoom: 11,
            oldStorageKey: 'chibaCityTownCheckinVisitsV1'
        }
    };
    let AREA_ID = 'tama';
    let OLD_STORAGE_KEY = AREAS[AREA_ID].oldStorageKey;
    let areaRequestId = 0;
    const areaGeoData = {};
    const areaBounds = {};
    let areaSwitchInProgress = false;
    let pendingAreaId = null;
    let gpsFixReceived = false;

    // 両地域の町丁目ポリゴンを読み込み、GPSの座標で自動判定する。
    async function preloadAreaData() {
        await Promise.all(Object.entries(AREAS).map(async ([id, config]) => {
            try {
                const response = await fetch(config.file);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                areaGeoData[id] = data;
                areaBounds[id] = turf.bbox(data);
                if (lastLatitude !== null) {
                    detectAreaFromGPS(lastLatitude, lastLongitude);
                }
            } catch (error) {
                console.error(config.label + 'の地図データを取得できません:', error);
                document.getElementById('locationInfo').textContent =
                    config.label + 'の地図データを取得できませんでした';
            }
        }));
    }

    function detectAreaFromGPS(lat, lng) {
        const point = turf.point([lng, lat]);
        for (const [id, data] of Object.entries(areaGeoData)) {
            const bounds = areaBounds[id];
            if (!bounds || lng < bounds[0] || lng > bounds[2] ||
                lat < bounds[1] || lat > bounds[3]) continue;
            if (data.features.some(feature => turf.booleanPointInPolygon(point, feature))) {
                if (id !== AREA_ID) {
                    pendingAreaId = id;
                    if (!areaSwitchInProgress) processPendingArea();
                }
                return id;
            }
        }
        return null;
    }

    async function processPendingArea() {
        if (areaSwitchInProgress) return;
        areaSwitchInProgress = true;
        try {
            while (pendingAreaId && pendingAreaId !== AREA_ID) {
                const target = pendingAreaId;
                pendingAreaId = null;
                await switchArea(target);
            }
        } finally {
            areaSwitchInProgress = false;
        }
    }

    function getTownName(feature) {
        return feature.properties.S_NAME || '';
    }

    // 千葉市は同名の町が区をまたぐため、区名と町丁目名を組み合わせます。
    function getTownKey(feature) {
        const p = feature.properties;
        return AREA_ID === 'chiba-city'
            ? (p.CITY_NAME || '') + '|' + (p.S_NAME || '')
            : (p.S_NAME || '');
    }

    function getTownLabel(feature) {
        const p = feature.properties;
        return AREA_ID === 'chiba-city'
            ? (p.CITY_NAME || '') + ' ' + (p.S_NAME || '')
            : (p.S_NAME || '');
    }

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let visits = {};
    let townLayer = null;
    let currentTownForCheckIn = null;
    let currentTownLayer = null;

    let locationMarker = null;
    let watchId = null;
    let firstLocationUpdate = true;
    let lastLatitude = null;
    let lastLongitude = null;
    let headingUpEnabled = false;
    let lastHeading = null;
    let headingUpButton = null;

    // 訪問色付き町丁目レイヤーの表示状態
    let visitLayerVisible = true;
    let visitLayerToggleButton = null;

    const colors = [
        '#ffffff',
        '#90ee90',
        '#87ceeb',
        '#ffff66',
        '#ffb347',
        '#ff6666'
    ];

    // ============================================================
    // 地図
    // ============================================================
    const map = L.map('map', {
        center: [35.63, 139.43],
        zoom: 13,
        rotate: true,
        touchRotate: true,
        dragRotate: true,
        rotateClockwise: true,
        preventPageGestures: true,
        rotateControl: {
            position: 'topright',
            behavior: 'reset',
            closeOnZeroBearing: false
        }
    });

    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);

    // ============================================================
    // 「進行方向を上」モード
    // GPSが返す heading（移動方向）を使って地図を自動回転します。
    // 停止中などheadingが得られない間は、最後に得た向きを維持します。
    // ============================================================
    const HeadingUpControl = L.Control.extend({
        options: { position: 'topright' },

        onAdd: function() {
            const container = L.DomUtil.create(
                'div', 'leaflet-control-heading-up'
            );
            const button = L.DomUtil.create('button', '', container);
            button.type = 'button';
            button.textContent = '進行↑';
            button.title = '進行方向を画面上にする';
            button.setAttribute('aria-label', '進行方向を画面上にする');

            headingUpButton = button;

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);
            L.DomEvent.on(button, 'click', function(e) {
                L.DomEvent.stop(e);
                toggleHeadingUp();
            });

            return container;
        }
    });

    map.addControl(new HeadingUpControl());

    function toggleHeadingUp() {
        headingUpEnabled = !headingUpEnabled;

        if (headingUpButton) {
            headingUpButton.classList.toggle('active', headingUpEnabled);
            headingUpButton.textContent =
                headingUpEnabled ? '進行↑ ON' : '進行↑';
        }

        if (headingUpEnabled) {
            // 追跡していなければGPS追跡も開始。
            if (watchId === null) getLocation();

            if (lastHeading !== null && typeof map.setHeading === 'function') {
                map.setHeading(lastHeading);
            }
        } else {
            if (typeof map.setHeading === 'function') {
                map.setHeading(null);
            }
        }
    }

    // ============================================================
    // 地図内の「現在地に戻る」ボタン
    // 地図を画面いっぱいに表示しても常に右下に残ります。
    // ============================================================
    const CurrentLocationControl = L.Control.extend({
        options: {
            position: 'bottomright'
        },

        onAdd: function() {
            const container = L.DomUtil.create(
                'div',
                'leaflet-control-current-location'
            );

            const button = L.DomUtil.create('button', '', container);
            button.type = 'button';
            button.innerHTML = '◎';
            button.title = '現在地に戻る';
            button.setAttribute('aria-label', '現在地に戻る');

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);

            L.DomEvent.on(button, 'click', function(e) {
                L.DomEvent.stop(e);
                returnToCurrentLocation();
            });

            return container;
        }
    });

    map.addControl(new CurrentLocationControl());

    // ============================================================
    // 地図内の「ページ最上部へ戻る」ボタン
    // 地図を大きく表示して上部の操作部分が見えなくなっても、
    // この ↑ を押せばページを最初の位置まで戻せます。
    // ============================================================
    const PageTopControl = L.Control.extend({
        options: {
            position: 'bottomright'
        },

        onAdd: function() {
            const container = L.DomUtil.create(
                'div',
                'leaflet-control-page-top'
            );

            const button = L.DomUtil.create('button', '', container);
            button.type = 'button';
            button.innerHTML = '↑';
            button.title = 'ページの一番上へ戻る';
            button.setAttribute('aria-label', 'ページの一番上へ戻る');

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);

            L.DomEvent.on(button, 'click', function(e) {
                L.DomEvent.stop(e);
                window.scrollTo({
                    top: 0,
                    left: 0,
                    behavior: 'smooth'
                });
            });

            return container;
        }
    });

    map.addControl(new PageTopControl());

    // ============================================================
    // 地図内の「訪問色レイヤー ON/OFF」ボタン
    // 道路・店名などを見やすくしたいときに町丁目レイヤーを隠せます。
    // 再度ONにすると、訪問回数の色・現在地の強調もそのまま復元します。
    // ============================================================
    const VisitLayerControl = L.Control.extend({
        options: {
            position: 'bottomright'
        },

        onAdd: function() {
            const container = L.DomUtil.create(
                'div',
                'leaflet-control-visit-layer'
            );

            const button = L.DomUtil.create('button', '', container);
            button.type = 'button';
            button.title = '訪問色レイヤーを表示・非表示';
            button.setAttribute(
                'aria-label',
                '訪問色レイヤーを表示・非表示'
            );

            visitLayerToggleButton = button;
            updateVisitLayerButton();

            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);

            L.DomEvent.on(button, 'click', function(e) {
                L.DomEvent.stop(e);
                toggleVisitLayer();
            });

            return container;
        }
    });

    map.addControl(new VisitLayerControl());

    function updateVisitLayerButton() {
        if (!visitLayerToggleButton) return;

        visitLayerToggleButton.textContent =
            visitLayerVisible ? '色 OFF' : '色 ON';

        visitLayerToggleButton.title =
            visitLayerVisible
                ? '訪問色レイヤーを隠す'
                : '訪問色レイヤーを表示する';
    }

    function toggleVisitLayer() {
        if (!townLayer) return;

        if (visitLayerVisible) {
            map.removeLayer(townLayer);
            visitLayerVisible = false;
        } else {
            townLayer.addTo(map);
            visitLayerVisible = true;

            // 表示を戻したとき、Visit色と現在地の強調を最新状態にする。
            refreshAllTownStyles();
        }

        updateVisitLayerButton();
    }

    // ============================================================
    // Visitデータ
    // ============================================================
    function getVisitRecord(townName) {
        const r = visits[townName] || {};
        return {
            count: Math.min(Number(r.count) || 0, 5),
            lastCheckInDate: r.lastCheckInDate || null
        };
    }

    function getTodayString() {
        const d = new Date();
        return d.getFullYear() + '-' +
            String(d.getMonth() + 1).padStart(2, '0') + '-' +
            String(d.getDate()).padStart(2, '0');
    }

    function normalStyle(feature) {
        const record = getVisitRecord(getTownKey(feature));
        feature.visitCount = record.count;

        return {
            color: '#555',
            weight: 1,
            fillColor: colors[record.count],
            fillOpacity: record.count === 0 ? 0.5 : 0.7
        };
    }

    function onEachFeature(feature, layer) {
        const townName = getTownKey(feature);
        feature.visitCount = getVisitRecord(townName).count;

        layer.on('click', function() {
            const record = getVisitRecord(townName);

            layer.bindPopup(
                '<b>' + getTownLabel(feature) + '</b><br>' +
                '訪問回数：' + record.count + '回'
            ).openPopup();
        });
    }

    function refreshAllTownStyles() {
        if (!townLayer) return;

        townLayer.eachLayer(function(layer) {
            const townName = getTownKey(layer.feature);
            const count = getVisitRecord(townName).count;

            layer.feature.visitCount = count;

            layer.setStyle({
                color: layer === currentTownLayer ? '#0000ff' : '#555',
                weight: layer === currentTownLayer ? 4 : 1,
                fillColor: colors[count],
                fillOpacity: layer === currentTownLayer
                    ? 0.8
                    : (count === 0 ? 0.5 : 0.7)
            });
        });
    }

    // ============================================================
    // GeoJSON
    // ============================================================
    async function loadAreaGeoJSON() {
        const requestId = ++areaRequestId;
        const config = AREAS[AREA_ID];
        const info = document.getElementById('locationInfo');
        info.textContent = config.label + 'の町丁目データを読み込み中...';

        try {
            const data = areaGeoData[AREA_ID] || await (async () => {
                const response = await fetch(config.file);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
            })();
            if (requestId !== areaRequestId) return;

            if (townLayer) map.removeLayer(townLayer);
            currentTownForCheckIn = null;
            currentTownLayer = null;

            townLayer = L.geoJSON(data, {
                style: normalStyle,
                onEachFeature: onEachFeature
            });
            if (visitLayerVisible) townLayer.addTo(map);
            refreshAllTownStyles();
            updateCheckInUI();
            info.textContent = config.label + '：現在地を確認しています';
            if (lastLatitude !== null) {
                const detected = detectAreaFromGPS(lastLatitude, lastLongitude);
                if (detected === AREA_ID) findCurrentTown(lastLatitude, lastLongitude);
                else {
                    currentTownForCheckIn = null;
                    updateCheckInUI();
                }
            }
        } catch (error) {
            if (requestId !== areaRequestId) return;
            console.error('GeoJSONの読み込みに失敗しました:', error);
            info.textContent = config.label + 'の地図データを読み込めませんでした';
            alert(config.file + ' を読み込めませんでした。GitHub上の配置を確認してください。');
        }
    }

    async function switchArea(areaId) {
        if (!AREAS[areaId] || areaId === AREA_ID) return;
        AREA_ID = areaId;
        OLD_STORAGE_KEY = AREAS[AREA_ID].oldStorageKey;
        visits = {};
        currentTownForCheckIn = null;
        currentTownLayer = null;
        if (townLayer) {
            map.removeLayer(townLayer);
            townLayer = null;
        }
        document.getElementById('checkInButton').disabled = true;
        document.getElementById('checkInStatus').textContent = 'Visit記録を読み込み中...';
        // GPS位置を維持し、地域切替時に勝手に別の中心へ飛ばさない。
        const thisArea = AREA_ID;
        const geoTask = loadAreaGeoJSON();
        if (currentUser) await loadVisitsFromSupabase(thisArea);
        if (thisArea !== AREA_ID) return;
        updateMigrationButton();
        await geoTask;
    }

    // 地域切替UIは置かず、両地域のデータをGPS判定に使用します。
    loadAreaGeoJSON();
    preloadAreaData();

    // ============================================================
    // 設定パネル
    // ============================================================
    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');

        // 未ログイン時はログイン欄が通常表示されるため、
        // 設定パネルにはログイン後専用の操作だけを置きます。
        if (!currentUser) {
            alert('現在はログインしていません');
            return;
        }

        panel.classList.toggle('open');
    }

    function closeSettings() {
        document.getElementById('settingsPanel').classList.remove('open');
    }

    // ============================================================
    // Supabase認証
    // ============================================================
    async function initializeAuth() {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) {
            console.error(error);
            document.getElementById('authStatus').textContent =
                'ログイン状態を確認できませんでした';
            return;
        }

        await applySession(data.session);

        supabaseClient.auth.onAuthStateChange((event, session) => {
            setTimeout(function() {
                applySession(session);
            }, 0);
        });
    }

    async function applySession(session) {
        currentUser = session ? session.user : null;

        const loginForm = document.getElementById('loginForm');
        const loggedInControls =
            document.getElementById('loggedInControls');
        const authStatus = document.getElementById('authStatus');

        if (currentUser) {
            loginForm.style.display = 'none';
            loggedInControls.style.display = 'block';

            // メールアドレスは通常画面には表示しません。
            authStatus.textContent = '● ログイン済み';

            await loadVisitsFromSupabase();
            updateMigrationButton();
        } else {
            visits = {};
            loginForm.style.display = 'block';
            loggedInControls.style.display = 'none';
            authStatus.textContent = 'ログインしてください';
            closeSettings();

            refreshAllTownStyles();
            updateCheckInUI();
        }
    }

    async function login() {
        const email =
            document.getElementById('email').value.trim();
        const password =
            document.getElementById('password').value;

        if (!email || !password) {
            alert('メールアドレスとパスワードを入力してください');
            return;
        }

        document.getElementById('authStatus').textContent =
            'ログイン中...';

        const { error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            console.error(error);
            document.getElementById('authStatus').textContent =
                'ログインに失敗しました';

            alert(
                'ログインできませんでした。\n' +
                'メールアドレスとパスワードを確認してください。'
            );
        }
    }

    async function logout() {
        closeSettings();

        const { error } = await supabaseClient.auth.signOut();

        if (error) {
            console.error(error);
            alert('ログアウトに失敗しました');
        }
    }

    // ============================================================
    // SupabaseからVisit記録を読む
    // ============================================================
    async function loadVisitsFromSupabase(requestedArea = AREA_ID) {
        if (!currentUser) return;

        document.getElementById('checkInStatus').textContent =
            'Visit記録を読み込み中...';

        const { data, error } = await supabaseClient
            .from('town_visits')
            .select(
                'town_key, town_name, visit_count, last_checkin_date'
            )
            .eq('area', requestedArea);

        if (error) {
            console.error(error);

            alert(
                'Visit記録を読み込めませんでした。\n' +
                'Supabaseの設定を確認してください。'
            );

            updateCheckInUI();
            return;
        }

        if (requestedArea !== AREA_ID) return;
        visits = {};

        for (const row of data) {
            visits[row.town_key] = {
                count: Math.min(Number(row.visit_count) || 0, 5),
                lastCheckInDate: row.last_checkin_date || null
            };
        }

        refreshAllTownStyles();
        updateCheckInUI();
    }

    // ============================================================
    // CHECK IN
    // ============================================================
    function updateCheckInUI() {
        const button =
            document.getElementById('checkInButton');
        const status =
            document.getElementById('checkInStatus');

        if (!currentUser) {
            button.disabled = true;
            status.textContent =
                'ログインするとチェックインできます';
            return;
        }

        if (!currentTownForCheckIn) {
            button.disabled = true;
            status.textContent =
                '現在地を取得するとチェックインできます';
            return;
        }

        const townName =
            getTownKey(currentTownForCheckIn.feature);
        const record = getVisitRecord(townName);
        const today = getTodayString();

        if (record.count >= 5) {
            button.disabled = true;
            status.textContent =
                getTownLabel(currentTownForCheckIn.feature) + '：5回達成済みです';
        } else if (record.lastCheckInDate === today) {
            button.disabled = true;
            status.textContent =
                getTownLabel(currentTownForCheckIn.feature) +
                '：今日はCHECK IN済みです（' +
                record.count + '/5回）';
        } else {
            button.disabled = false;
            status.textContent =
                getTownLabel(currentTownForCheckIn.feature) +
                '：CHECK INできます（現在 ' +
                record.count + '/5回）';
        }
    }

    async function checkIn() {
        if (!currentUser || !currentTownForCheckIn || areaSwitchInProgress) return;

        const button =
            document.getElementById('checkInButton');
        const townName =
            getTownKey(currentTownForCheckIn.feature);
        const record = getVisitRecord(townName);
        const today = getTodayString();

        if (
            record.count >= 5 ||
            record.lastCheckInDate === today
        ) {
            updateCheckInUI();
            return;
        }

        button.disabled = true;

        document.getElementById('checkInStatus').textContent =
            getTownLabel(currentTownForCheckIn.feature) + '：保存中...';

        const newCount = record.count + 1;
        const checkinArea = AREA_ID;
        const checkinFeature = currentTownForCheckIn.feature;

        const { error } = await supabaseClient
            .from('town_visits')
            .upsert(
                {
                    user_id: currentUser.id,
                    area: checkinArea,
                    town_key: townName,
                    town_name: getTownLabel(currentTownForCheckIn.feature),
                    visit_count: newCount,
                    last_checkin_date: today,
                    updated_at: new Date().toISOString()
                },
                {
                    onConflict: 'user_id,area,town_key'
                }
            );

        if (error) {
            console.error(error);

            alert(
                'CHECK INを保存できませんでした。\n' +
                '通信状態を確認して、もう一度試してください。'
            );

            updateCheckInUI();
            return;
        }

        if (checkinArea !== AREA_ID ||
            !currentTownForCheckIn ||
            currentTownForCheckIn.feature !== checkinFeature) return;

        visits[townName] = {
            count: newCount,
            lastCheckInDate: today
        };

        currentTownForCheckIn.feature.visitCount = newCount;
        highlightCurrentTown(currentTownForCheckIn);

        currentTownForCheckIn.bindPopup(
            '<b>' + getTownLabel(checkinFeature) + '</b><br>' +
            'CHECK INしました！<br>' +
            '訪問回数：' + newCount + '回'
        ).openPopup();

        updateCheckInUI();

        alert(
            getTownLabel(checkinFeature) + ' にCHECK INしました！\n' +
            '訪問回数：' + newCount + '/5回'
        );
    }

    // ============================================================
    // 旧localStorage版からSupabaseへ移行
    // ============================================================
    function getOldLocalVisits() {
        try {
            return JSON.parse(
                localStorage.getItem(OLD_STORAGE_KEY)
            ) || {};
        } catch (e) {
            return {};
        }
    }

    function updateMigrationButton() {
        const button =
            document.getElementById('migrationButton');

        if (!button || !currentUser) return;

        // 旧千葉市版の保存キー形式は異なる可能性があるため、
        // 自動移行は多摩市のみに限定して誤登録を防ぎます。
        if (AREA_ID !== 'tama') {
            button.style.display = 'none';
            return;
        }
        const oldVisits = getOldLocalVisits();

        const hasOldVisits =
            Object.keys(oldVisits).some(function(name) {
                return Number(
                    oldVisits[name] && oldVisits[name].count
                ) > 0;
            });

        button.style.display =
            hasOldVisits ? 'inline-block' : 'none';
    }

    async function migrateLocalVisits() {
        if (!currentUser || AREA_ID !== 'tama') return;

        const oldVisits = getOldLocalVisits();

        const townNames =
            Object.keys(oldVisits).filter(function(name) {
                return Number(
                    oldVisits[name] && oldVisits[name].count
                ) > 0;
            });

        if (townNames.length === 0) {
            alert(
                'この端末に移行できる旧Visit記録はありません'
            );
            updateMigrationButton();
            return;
        }

        const ok = confirm(
            'この端末に残っている旧Visit記録をSupabaseへ移行します。\n' +
            'すでにクラウドに記録がある町丁目は、Visit回数が多い方を残します。\n\n' +
            '実行しますか？'
        );

        if (!ok) return;

        const rows = [];
        const migrationAreaId = AREA_ID;

        for (const townName of townNames) {
            const localRecord = oldVisits[townName] || {};
            const cloudRecord = getVisitRecord(townName);

            const localCount =
                Math.min(Number(localRecord.count) || 0, 5);
            const cloudCount = cloudRecord.count;

            let count = Math.max(localCount, cloudCount);
            let lastDate = null;

            if (localCount > cloudCount) {
                lastDate =
                    localRecord.lastCheckInDate || null;
            } else if (cloudCount > localCount) {
                lastDate =
                    cloudRecord.lastCheckInDate || null;
            } else {
                const localDate =
                    localRecord.lastCheckInDate || '';
                const cloudDate =
                    cloudRecord.lastCheckInDate || '';

                lastDate =
                    localDate >= cloudDate
                        ? (localDate || null)
                        : (cloudDate || null);
            }

            rows.push({
                user_id: currentUser.id,
                area: AREA_ID,
                town_key: townName,
                town_name: townName,
                visit_count: count,
                last_checkin_date: lastDate,
                updated_at: new Date().toISOString()
            });
        }

        if (migrationAreaId !== AREA_ID) {
            alert('地域が切り替わったため、移行を中止しました。');
            return;
        }
        const { error } = await supabaseClient
            .from('town_visits')
            .upsert(
                rows,
                {
                    onConflict: 'user_id,area,town_key'
                }
            );

        if (error) {
            console.error(error);

            alert(
                '旧Visit記録の移行に失敗しました。\n' +
                '旧データは削除していません。'
            );
            return;
        }

        await loadVisitsFromSupabase();

        // 移行成功後も、念のため旧localStorageは自動削除しません。
        // 必要なら後で手動削除できます。
        document.getElementById('migrationButton').style.display =
            'none';

        alert(
            '旧Visit記録をSupabaseへ移行しました。\n' +
            '旧データは念のためこの端末にも残しています。'
        );
    }

    // ============================================================
    // 現在いる町丁目を強調
    // ============================================================
    function highlightCurrentTown(layer) {
        if (currentTownLayer && currentTownLayer !== layer) {
            const oldFeature = currentTownLayer.feature;
            const oldCount = oldFeature.visitCount || 0;

            currentTownLayer.setStyle({
                color: '#555',
                weight: 1,
                fillColor: colors[oldCount],
                fillOpacity: oldCount === 0 ? 0.5 : 0.7
            });
        }

        currentTownLayer = layer;

        const feature = layer.feature;
        const count = feature.visitCount || 0;

        layer.setStyle({
            color: '#0000ff',
            weight: 4,
            fillColor: colors[count],
            fillOpacity: 0.8
        });
    }

    // ============================================================
    // 現在地をリアルタイム追跡
    // ============================================================
    function getLocation() {
        if (!navigator.geolocation) {
            alert('このブラウザはGPSに対応していません');
            return;
        }

        document.getElementById('locationInfo').textContent =
            '現在地を追跡しています……';

        const trackingButton = document.getElementById('trackingButton');
        if (trackingButton) {
            trackingButton.textContent = '追跡中・現在地へ';
        }

        if (watchId !== null) {
            returnToCurrentLocation();
            return;
        }

        watchId = navigator.geolocation.watchPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const heading = position.coords.heading;

                lastLatitude = lat;
                lastLongitude = lng;
                gpsFixReceived = true;
                detectAreaFromGPS(lat, lng);

                if (
                    heading !== null &&
                    Number.isFinite(heading) &&
                    position.coords.speed !== 0
                ) {
                    lastHeading = heading;

                    if (
                        headingUpEnabled &&
                        typeof map.setHeading === 'function'
                    ) {
                        map.setHeading(heading, {
                            ease: 0.18,
                            deadzone: 1
                        });
                    }
                }

                if (!locationMarker) {
                    locationMarker =
                        L.marker([lat, lng])
                            .addTo(map)
                            .bindPopup('現在地');
                } else {
                    locationMarker.setLatLng([lat, lng]);
                }

                if (firstLocationUpdate) {
                    map.setView([lat, lng], 16);
                    firstLocationUpdate = false;
                }

                if (!areaSwitchInProgress && !pendingAreaId) {
                    findCurrentTown(lat, lng);
                }
            },

            function(error) {
                console.log('GPSエラー:', error);

                document.getElementById(
                    'locationInfo'
                ).textContent =
                    '現在地を取得できませんでした';

                alert(
                    '現在地を取得できませんでした。\n' +
                    'ブラウザの位置情報設定を確認してください。'
                );
            },

            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    // ============================================================
    // 現在地へ戻る
    // 上部ボタンと地図内ボタンの両方から同じ関数を呼びます。
    // ============================================================
    function returnToCurrentLocation() {
        if (
            lastLatitude !== null &&
            lastLongitude !== null
        ) {
            map.setView(
                [lastLatitude, lastLongitude],
                16
            );
            return;
        }

        if (watchId === null) {
            getLocation();
        } else {
            alert(
                '現在地を取得中です。' +
                '少し待ってからもう一度押してください。'
            );
        }
    }

    // ============================================================
    // GPS位置から町丁目を探す
    // ============================================================
    function findCurrentTown(lat, lng) {
        if (!townLayer) {
            document.getElementById(
                'locationInfo'
            ).textContent =
                '町丁目データを読み込み中です……';
            return;
        }

        const point = turf.point([lng, lat]);
        let foundTown = null;

        townLayer.eachLayer(function(layer) {
            if (foundTown) return;

            const feature = layer.feature;

            if (
                turf.booleanPointInPolygon(
                    point,
                    feature
                )
            ) {
                foundTown = layer;
            }
        });

        if (foundTown) {
            const townName = getTownLabel(foundTown.feature);

            console.log(
                '現在いる町丁目:',
                townName
            );

            document.getElementById(
                'locationInfo'
            ).textContent =
                '現在地：' + townName;

            currentTownForCheckIn = foundTown;

            highlightCurrentTown(foundTown);
            updateCheckInUI();

            // GPS更新のたびにポップアップは自動表示しない。
        } else {
            console.log(
                '現在地は町丁目ポリゴンの外です'
            );

            document.getElementById(
                'locationInfo'
            ).textContent =
                '現在地：町丁目を特定できませんでした';

            currentTownForCheckIn = null;
            updateCheckInUI();
        }
    }

    // ============================================================
    // 起動
    // ============================================================
    initializeAuth();
    // 初回起動時にGPSを要求し、現在地に応じて地域を自動選択。
    getLocation();
</script>
